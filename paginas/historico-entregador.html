<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico - LZ Express</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<main class="pagina-historico-entregador">

    <header class="cabecalho-historico-entregador">

        <button
            class="voltar"
            onclick="abrirEntregasEntregador()">

            ←

        </button>

        <div>

            <h1>Histórico</h1>

        </div>

    </header>


    <div class="abas-historico">

        <button
            class="aba-historico ativa"
            id="abaTodas"
            onclick="filtrarHistoricoEntregador('todas')">
            Todas
        </button>

        <button
            class="aba-historico"
            id="abaConcluidas"
            onclick="filtrarHistoricoEntregador('concluidas')">
            Concluídas
        </button>

    </div>


    <section
        class="lista-historico-entregador"
        id="listaHistoricoEntregador"
    >

    </section>


    <nav class="menu-inferior-entregador">

        <button
            class="menu-entregador"
            onclick="irParaInicioEntregador()">

            <span>⌂</span>
            <small>Início</small>

        </button>

        <button
            class="menu-entregador ativo"
            onclick="abrirEntregasEntregador()">

            <span>🚚</span>
            <small>Entregas</small>

        </button>

        <button
            class="menu-entregador"
            onclick="abrirPerfilEntregador()">

            <span>♙</span>
            <small>Perfil</small>

        </button>

    </nav>

</main>

<script src="../js/app.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>
    <script type="module" src="../js/firebase-dados.js"></script>

</body>
</html>

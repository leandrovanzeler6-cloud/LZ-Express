<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrega em andamento - LZ Express</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="pagina-empresa">

        <button class="voltar" onclick="irParaInicioEmpresa()">
            ←
        </button>

        <section class="status-entrega">

            <div class="icone-status">
                🛵
            </div>

            <h1>Entrega em andamento</h1>

            <p id="numeroEntrega">
                Entrega #0001
            </p>

            <div class="linha-status">

                <div class="status ativo" id="statusEmpresa1">
                    <span>✓</span>
                    <strong>Solicitada</strong>
                </div>

                <div class="status" id="statusEmpresa2">
                    <span>2</span>
                    <strong>Em andamento</strong>
                </div>

                <div class="status" id="statusEmpresa3">
                    <span>3</span>
                    <strong>Em rota</strong>
                </div>

                <div class="status" id="statusEmpresa4">
                    <span>4</span>
                    <strong>Entregue</strong>
                </div>

            </div>

            <div class="info-entrega">

                <strong>Destino</strong>

                <p id="destinoAndamento">
                    Carregando...
                </p>

            </div>

            <div class="aguardando-entregador">

                🛵

                <strong>
                    Aguardando um entregador disponível...
                </strong>

                <span>
                    Assim que um entregador aceitar,
                    o status será atualizado.
                </span>

            </div>

            <button
                class="botao-continuar"
                onclick="irParaInicioEmpresa()">

                VOLTAR AO INÍCIO

            </button>

        </section>

    </main>

    <script src="../js/app.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>
    <script type="module" src="../js/firebase-dados.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Histórico - LZ Express</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="pagina-empresa">

        <button class="voltar" onclick="irParaInicioEmpresa()">
            ←
        </button>

        <section class="pagina-conteudo">

            <h1>Histórico de entregas</h1>

            <p>
                Confira suas entregas anteriores.
            </p>

            <div id="listaHistorico"></div>

        </section>

        <nav class="menu-inferior">

            <button class="menu-item" onclick="irParaInicioEmpresa()">
                <span>⌂</span>
                <small>Início</small>
            </button>

            <button class="menu-item" onclick="abrirEntregasEmpresa()">
                <span>🚚</span>
                <small>Entregas</small>
            </button>

            <button class="menu-item ativo">
                <span>🕘</span>
                <small>Histórico</small>
            </button>

            <button class="menu-item" onclick="abrirUsuarioEmpresa()">
                <span>♙</span>
                <small>Usuário</small>
            </button>

        </nav>

    </main>

    <script src="../js/app.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>
    <script type="module" src="../js/firebase-dados.js"></script>

</body>

</html>

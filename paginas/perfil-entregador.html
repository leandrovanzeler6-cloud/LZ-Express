<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil - LZ Express</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<main class="pagina-perfil-entregador">

    <section class="topo-perfil-entregador">

        <div
            class="foto-perfil-entregador"
            id="fotoPerfilEntregador">

            👤

        </div>

        <h1 id="nomePerfilEntregador">
            Entregador
        </h1>

        <p>
            Perfil do entregador
        </p>

    </section>


    <section class="menu-perfil-entregador">


        <button
            class="item-perfil-entregador"
            onclick="abrirDadosEntregador()">

            <span>👤</span>

            <div>
                <strong>
                    Meus dados
                </strong>

                <small>
                    Dados pessoais e endereço
                </small>
            </div>

            <b>›</b>

        </button>


        <button
            class="item-perfil-entregador"
            onclick="abrirDadosMotoEntregador()">

            <span>🏍️</span>

            <div>
                <strong>
                    Minha motocicleta
                </strong>

                <small>
                    Dados da sua moto
                </small>
            </div>

            <b>›</b>

        </button>


        <button
            class="item-perfil-entregador"
            onclick="abrirAlterarSenhaEntregador()">

            <span>🔐</span>

            <div>
                <strong>
                    Alterar senha
                </strong>

                <small>
                    Mantenha sua conta segura
                </small>
            </div>

            <b>›</b>

        </button>


        <button
            class="item-perfil-entregador"
            onclick="abrirNotificacoesEntregador()">

            <span>🔔</span>

            <div>
                <strong>
                    Notificações
                </strong>

                <small>
                    Gerencie suas notificações
                </small>
            </div>

            <b>›</b>

        </button>


        <button
            class="item-perfil-entregador"
            onclick="abrirSobreEntregador()">

            <span>ℹ️</span>

            <div>
                <strong>
                    Sobre o LZ Express
                </strong>

                <small>
                    Informações sobre a plataforma
                </small>
            </div>

            <b>›</b>

        </button>


        <button
            class="item-perfil-entregador sair"
            onclick="sairEntregador()">

            <span>↪️</span>

            <div>
                <strong>
                    Sair da conta
                </strong>

                <small>
                    Encerrar sessão
                </small>
            </div>

            <b>›</b>

        </button>


    </section>


    <nav class="menu-inferior-entregador">

        <button
            class="menu-entregador"
            onclick="irParaInicioEntregador()">

            <span>⌂</span>
            <small>Início</small>

        </button>


        <button
            class="menu-entregador"
            onclick="abrirEntregasEntregador()">

            <span>🚚</span>
            <small>Entregas</small>

        </button>


        <button
            class="menu-entregador ativo"
            onclick="abrirPerfilEntregador()">

            <span>♙</span>
            <small>Perfil</small>

        </button>

    </nav>

</main>

<script src="../js/app.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>
    <script type="module" src="../js/firebase-dados.js"></script>

</body>
</html>

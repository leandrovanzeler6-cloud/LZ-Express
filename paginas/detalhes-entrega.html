<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Entrega - LZ Express</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<main class="pagina-detalhes-entrega">

    <header class="cabecalho-detalhes">

        <button class="voltar" onclick="abrirEntregasEntregador()">
            ←
        </button>

        <h1>
            Detalhes da Entrega
            <span id="detalheNumero">#000000</span>
        </h1>

    </header>


    <section class="conteudo-detalhes">

        <div class="card-detalhes">

            <div class="secao-detalhes">

                <small>RETIRADA (LOJA)</small>

                <strong id="detalheEmpresa">---</strong>

                <p id="detalheRetirada">Carregando...</p>

            </div>


            <div class="secao-detalhes">

                <small>DESTINO (CLIENTE)</small>

                <p><strong>Nome:</strong> <span id="detalheClienteNome">---</span></p>
                <p><strong>Endereço:</strong> <span id="detalheEndereco">Carregando...</span></p>
                <p><strong>Bairro:</strong> <span id="detalheBairro">---</span></p>
                <p><strong>Ponto de referência:</strong> <span id="detalheReferencia">---</span></p>

            </div>


            <div class="secao-detalhes secao-observacoes">

                <small>OBSERVAÇÕES</small>

                <p id="detalheObservacoes">
                    Nenhuma observação.
                </p>

            </div>

        </div>


        <div class="botoes-acao-entrega">

            <button
                class="botao-recusar"
                onclick="recusarEntrega()">

                ✕ RECUSAR

            </button>

            <button
                class="botao-aceitar"
                onclick="aceitarEntrega()">

                ✓ ACEITAR

            </button>

        </div>

        <button
            class="link-voltar"
            onclick="abrirEntregasEntregador()">

            ← Voltar

        </button>

    </section>

</main>

<script src="../js/app.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>
    <script type="module" src="../js/firebase-dados.js"></script>

</body>
</html>

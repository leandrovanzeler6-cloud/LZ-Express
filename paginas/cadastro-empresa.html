<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Empresa - LZ Express</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="tela-cadastro-empresa">

        <button class="voltar" onclick="voltarEmpresa()">
            ←
        </button>

        <!-- decoração: lâminas laranja -->
        <div class="lamina lamina-1" aria-hidden="true"></div>
        <div class="lamina lamina-2" aria-hidden="true"></div>

        <!-- topo -->
        <img
            src="../imagens/logo-topo-pequeno.png"
            alt="LZ Express"
            class="logo-topo-cadastro">

        <p class="tagline-topo-cadastro">
            ENTREGAS RÁPIDAS,<br>
            SIMPLES E SEGURAS. <span>//</span>
        </p>

        <div class="cadastro-empresa-container">

            <img
                src="../imagens/logo-card-cadastro.png"
                alt="LZ Express"
                class="logo-cadastro-empresa"
            >

            <h1>Cadastrar minha empresa</h1>

            <p class="texto-cadastro-empresa">
                Preencha os dados da sua empresa para começar a solicitar entregas.
            </p>

            <form id="formCadastroEmpresa">

                <div class="campo campo-com-icone">
                    <span class="icone-campo">🏢</span>
                    <input
                        type="text"
                        id="nomeEmpresa"
                        placeholder="Digite o nome da empresa"
                        required
                    >
                </div>

                <div class="campo campo-com-icone">
                    <span class="icone-campo">📞</span>
                    <input
                        type="tel"
                        id="whatsappEmpresa"
                        placeholder="(00) 00000-0000"
                        required
                    >
                </div>

                <div class="campo campo-com-icone">
                    <span class="icone-campo">📍</span>
                    <input
                        type="text"
                        id="ruaEmpresa"
                        placeholder="Digite a rua"
                        required
                    >
                </div>

                <div class="campo campo-com-icone">
                    <span class="icone-campo">🏠</span>
                    <input
                        type="text"
                        id="numeroEmpresa"
                        placeholder="Número"
                        required
                    >
                </div>

                <div class="campo campo-com-icone">
                    <span class="icone-campo">🏠</span>
                    <input
                        type="text"
                        id="bairroEmpresa"
                        placeholder="Digite o bairro"
                        required
                    >
                </div>

                <div class="campo campo-com-icone">
                    <span class="icone-campo">🏙️</span>
                    <input
                        type="text"
                        id="cidadeEmpresa"
                        placeholder="Digite a cidade"
                        required
                    >
                </div>

                <div class="campo campo-com-icone">
                    <span class="icone-campo">📝</span>
                    <input
                        type="text"
                        id="referenciaEmpresa"
                        placeholder="Ex: próximo à praça"
                    >
                </div>

                <div class="campo campo-arquivo">

                    <label for="fotoEmpresa" class="botao-escolher-arquivo">
                        📎 Escolher arquivo
                    </label>

                    <span class="nome-arquivo-escolhido" id="nomeArquivoEmpresa">
                        Nenhum arquivo escolhido
                    </span>

                    <input
                        type="file"
                        id="fotoEmpresa"
                        accept="image/*"
                        hidden
                    >

                    <small class="ajuda-foto">
                        Escolha uma foto da frente da sua empresa.
                    </small>

                </div>

                <div id="mensagemCadastroEmpresa"
                     class="mensagem-erro">
                </div>

                <button
                    type="submit"
                    class="botao-salvar-empresa">

                    💾 SALVAR CADASTRO

                </button>

            </form>

        </div>

    </main>

    <script src="../js/app.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>
    <script type="module" src="../js/firebase-dados.js"></script>

</body>

</html>

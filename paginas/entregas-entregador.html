<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entregas - LZ Express</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="pagina-entregas-entregador">

        <!-- CABEÇALHO -->

        <header class="cabecalho-pagina-entregador">

            <button class="voltar" onclick="irParaInicioEntregador()">
                ←
            </button>

            <div>
                <h1>Entregas</h1>

                <p>
                    Gerencie suas solicitações e corridas.
                </p>
            </div>

        </header>


        <!-- CONTEÚDO -->

        <section class="conteudo-entregas-entregador">


            <!-- NOVA SOLICITAÇÃO -->

            <div
                class="card-nova-entrega"
                id="cardNovaEntrega"
                style="display: none;"
            >

                <div class="icone-nova-entrega">
                    🔔
                </div>

                <div class="texto-nova-entrega">

                    <strong>
                        Nova solicitação!
                    </strong>

                    <p id="empresaNovaEntrega">
                        Uma empresa solicitou uma entrega.
                    </p>

                    <p id="valorNovaEntrega" class="valor-nova-entrega"></p>

                </div>

                <button
                    class="botao-detalhes-entrega"
                    onclick="abrirDetalhesEntrega()"
                >
                    VER DETALHES
                </button>

            </div>


            <!-- ENTREGA ATUAL -->

            <div
                class="card-entrega-atual"
                id="cardEntregaAtual"
                style="display: none;"
            >

                <div class="cabecalho-card-entrega">

                    <span>
                        🛵 Entrega em andamento
                    </span>

                    <span
                        class="status-entrega-entregador"
                        id="statusEntregaAtual"
                    >
                        Em andamento
                    </span>

                </div>

                <h2 id="empresaEntregaAtual">
                    Empresa
                </h2>

                <p id="destinoEntregaAtual">
                    Destino
                </p>

                <button
                    class="botao-continuar-entrega"
                    onclick="abrirAndamentoEntregador()"
                >
                    ACOMPANHAR ENTREGA
                </button>

            </div>


            <!-- SEM ENTREGA -->

            <div
                class="sem-entregas"
                id="semEntregas"
            >

                <div class="icone-sem-entregas">
                    🛵
                </div>

                <h2>
                    Nenhuma entrega no momento
                </h2>

                <p>
                    Quando uma empresa solicitar uma
                    entrega e você estiver disponível,
                    ela aparecerá aqui.
                </p>

                <button
                    onclick="irParaInicioEntregador()"
                    class="botao-voltar-inicio-entregador"
                >
                    VOLTAR AO INÍCIO
                </button>

            </div>


            <!-- HISTÓRICO -->

            <button
                class="botao-historico-entregador"
                onclick="abrirHistoricoEntregador()"
            >

                <span>
                    🕘
                </span>

                <div>
                    <strong>
                        Histórico de entregas
                    </strong>

                    <small>
                        Veja suas entregas concluídas.
                    </small>
                </div>

                <span class="seta-card">
                    ›
                </span>

            </button>

        </section>


        <!-- MENU INFERIOR -->

        <nav class="menu-inferior-entregador">

            <button
                class="menu-entregador"
                onclick="irParaInicioEntregador()"
            >

                <span>⌂</span>

                <small>
                    Início
                </small>

            </button>


            <button
                class="menu-entregador ativo"
                onclick="abrirEntregasEntregador()"
            >

                <span>🚚</span>

                <small>
                    Entregas
                </small>

            </button>


            <button
                class="menu-entregador"
                onclick="abrirPerfilEntregador()"
            >

                <span>♙</span>

                <small>
                    Perfil
                </small>

            </button>

        </nav>

    </main>


    <script src="../js/app.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>
    <script type="module" src="../js/firebase-dados.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - LZ Express</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="tela-cadastro">

        <!-- BOTÃO VOLTAR -->
        <button class="voltar" onclick="voltarInicio()">
            ←
        </button>

        <div class="cadastro-container">

            <!-- LOGO -->
            <img src="../imagens/logo.png"
                 alt="LZ Express"
                 class="logo-cadastro">

            <h1>Criar conta</h1>

            <p class="texto-cadastro">
                Preencha seus dados para criar sua conta.
            </p>

            <form id="formCadastro">

                <!-- NOME -->
                <div class="campo">
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>

                <!-- E-MAIL -->
                <div class="campo">
                    <label for="emailCadastro">E-mail</label>

                    <input
                        type="email"
                        id="emailCadastro"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <!-- SENHA -->
                <div class="campo">
                    <label for="senhaCadastro">Senha</label>

                    <div class="campo-senha">

                        <input
                            type="password"
                            id="senhaCadastro"
                            placeholder="Crie uma senha"
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            onclick="mostrarSenhaCadastro()">
                            👁️
                        </button>

                    </div>
                </div>

                <!-- CONFIRMAR SENHA -->
                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>

                    <div class="campo-senha">

                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            onclick="mostrarConfirmarSenha()">
                            👁️
                        </button>

                    </div>
                </div>

                <!-- MENSAGEM DE ERRO -->
                <p id="mensagemErro" class="mensagem-erro"></p>

                <!-- BOTÃO -->
                <button type="submit" class="botao-cadastrar">
                    CADASTRAR
                </button>

            </form>

            <p class="ja-tem-conta">
                Já tem uma conta?
                <button onclick="irParaLogin()">
                    Entrar
                </button>
            </p>

        </div>

    </main>

    <script src="../js/app.js"></script>
    <script type="module" src="../js/firebase-auth.js"></script>

</body>

</html>
